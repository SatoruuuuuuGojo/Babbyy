<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Playlist ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#F8C8DC,#E6D6FF);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
position:relative;
}

/* Floating Music Notes */

.note{
position:absolute;
font-size:28px;
opacity:.18;
animation:float 10s linear infinite;
user-select:none;
}

@keyframes float{

0%{
transform:translateY(110vh);
opacity:0;
}

20%{
opacity:.18;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

.container{

width:90%;
max-width:700px;

text-align:center;

z-index:10;

}

h1{

color:white;

font-size:48px;

margin-bottom:15px;

text-shadow:0 5px 15px rgba(0,0,0,.15);

}

.progress{

font-size:24px;

color:white;

letter-spacing:8px;

margin-bottom:20px;

}

.card{

background:rgba(255,255,255,.35);

backdrop-filter:blur(12px);

border-radius:30px;

padding:35px;

box-shadow:0 20px 40px rgba(0,0,0,.15);

transition:.4s;

}

.player{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-bottom:25px;

flex-wrap:wrap;

}

.vinyl{

width:120px;

height:120px;

border-radius:50%;

background:
radial-gradient(circle,#444 15%,#111 20%,#222 35%,#111 50%,#222 65%,#111);

animation:spin 7s linear infinite;

display:flex;

justify-content:center;

align-items:center;

}

.vinyl::after{

content:"";

width:18px;

height:18px;

background:white;

border-radius:50%;

}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

.thumbnail{

width:240px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.song{

color:white;

font-size:34px;

font-weight:bold;

margin-top:10px;

}

.artist{

color:white;

font-size:22px;

margin:12px 0 30px;

opacity:.9;

}

.play{

padding:16px 34px;

border:none;

border-radius:18px;

background:white;

color:#d63384;

font-size:18px;

cursor:pointer;

transition:.3s;

animation:pulse 2s infinite;

}

.play:hover{

transform:scale(1.05);

}

@keyframes pulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

}

.buttons{

display:flex;

justify-content:space-between;

margin-top:35px;

gap:20px;

}

.buttons button{

flex:1;

padding:15px;

border:none;

border-radius:18px;

background:white;

color:#d63384;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.buttons button:hover{

transform:translateY(-4px);

}

.back{

margin-top:25px;

width:220px;

padding:15px;

border:none;

border-radius:18px;

background:rgba(255,255,255,.4);

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.back:hover{

background:rgba(255,255,255,.55);

}

.slideOut{

opacity:0;

transform:translateX(-120px);

}

.slideIn{

opacity:1;

transform:translateX(0);

transition:.35s;

}

</style>

</head>

<body>

<div class="note" style="left:8%;animation-delay:0s;">🎵</div>
<div class="note" style="left:22%;animation-delay:2s;">♫</div>
<div class="note" style="left:40%;animation-delay:5s;">🎶</div>
<div class="note" style="left:63%;animation-delay:1s;">♪</div>
<div class="note" style="left:82%;animation-delay:4s;">🎵</div>

<div class="container">

<h1>🎵 Our Playlist ❤️</h1>

<div id="progress" class="progress">
● ○ ○ ○ ○ ○
</div>

<div id="card" class="card slideIn">

<div class="player">

<div class="vinyl"></div>

<img
id="thumbnail"
class="thumbnail"
src="">

</div>

<div id="song" class="song"></div>

<div id="artist" class="artist"></div>

<button
id="play"
class="play">

▶ Play on YouTube

</button>

<div class="buttons">

<button onclick="previousSong()">

◀ Previous

</button>

<button onclick="nextSong()">

Next ▶

</button>

</div>

<button
class="back"
onclick="window.location.href='index.html'">

🏠 Back

</button>

</div>

</div>

<script>

const songs = [

{
title:"LANDOKMAI",
artist:"LANDOKMAI",
link:"https://www.youtube.com/watch?v=eul1dPDpY4c&list=RDeul1dPDpY4c&start_radio=1&pp=ygUJbGFuZG9rbWFpoAcB",
id:"eul1dPDpY4c"
},

{
title:"Song 2",
artist:"",
link:"https://www.youtube.com/watch?v=5A5lnXL9s3c&list=RD5A5lnXL9s3c&start_radio=1&pp=ygUP4LiE4Lil4LmJ4Liy4LiioAcB",
id:"5A5lnXL9s3c"
},

{
title:"I Wanna Be Yours",
artist:"Arctic Monkeys",
link:"https://www.youtube.com/watch?v=nyuo9-OjNNg&list=RDnyuo9-OjNNg&start_radio=1&pp=ygUQaSB3YW5uYSBiZSB5b3Vyc6AHAdIHCQmZCwGHKiGM7w%3D%3D",
id:"nyuo9-OjNNg"
},

{
title:"I'm In Love With You",
artist:"The 1975",
link:"https://www.youtube.com/watch?v=UVzVUDXoi0Y&list=RDUVzVUDXoi0Y&start_radio=1&pp=ygUUaSdtIGluIGxvdmUgd2l0aCB5b3WgBwE%3D",
id:"UVzVUDXoi0Y"
},

{
title:"Song 5",
artist:"",
link:"https://www.youtube.com/watch?v=iNGdPc2_UzQ&list=RDiNGdPc2_UzQ&start_radio=1&pp=ygUPbWVsYm91cm5lIHR1YXlwoAcB",
id:"iNGdPc2_UzQ"
},

{
title:"Song 6",
artist:"",
link:"https://www.youtube.com/watch?v=HBOz7XiKl-s",
id:"HBOz7XiKl-s"
}

];

let current = 0;

function loadSong(){

const song = songs[current];

document.getElementById("song").innerHTML = song.title;

document.getElementById("artist").innerHTML = song.artist;

document.getElementById("thumbnail").src =
"https://img.youtube.com/vi/" + song.id + "/hqdefault.jpg";

document.getElementById("play").onclick = function(){

window.open(song.link,"_blank");

};

let dots="";

for(let i=0;i<songs.length;i++){

if(i==current){

dots+="● ";

}

else{

dots+="○ ";

}

}

document.getElementById("progress").innerHTML=dots;

}

function nextSong(){

const card=document.getElementById("card");

card.classList.remove("slideIn");

card.classList.add("slideOut");

setTimeout(()=>{

current++;

if(current>=songs.length){

current=0;

}

loadSong();

card.classList.remove("slideOut");

card.classList.add("slideIn");

},300);

}

function previousSong(){

const card=document.getElementById("card");

card.classList.remove("slideIn");

card.classList.add("slideOut");

setTimeout(()=>{

current--;

if(current<0){

current=songs.length-1;

}

loadSong();

card.classList.remove("slideOut");

card.classList.add("slideIn");

},300);

}

loadSong();

</script>

</body>
</html>
