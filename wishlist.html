<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Babby Wish List 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#F8C8DC,#E6D6FF);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.container{

width:90%;
max-width:800px;

text-align:center;

}

h1{

color:white;
font-size:48px;

margin-bottom:35px;

text-shadow:0 5px 15px rgba(0,0,0,.15);

}

.card{

background:rgba(255,255,255,.35);

backdrop-filter:blur(12px);

border-radius:25px;

padding:30px;

margin-bottom:30px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.card h2{

color:white;

margin-bottom:18px;

}

textarea{

width:100%;

height:180px;

resize:none;

border:none;

outline:none;

border-radius:18px;

padding:18px;

font-size:18px;

background:rgba(255,255,255,.7);

}

.saved{

margin-top:12px;

color:white;

font-weight:bold;

opacity:0;

transition:.3s;

}

.back{

margin-top:10px;

padding:15px 30px;

border:none;

border-radius:18px;

background:white;

color:#d63384;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.back:hover{

transform:translateY(-3px);

}

</style>

</head>

<body>

<div class="container">

<h1>💖 Babby Wish List</h1>

<div class="card">

<h2>🛍️ Things Babby Want</h2>

<textarea
id="wishlist"
placeholder="Write your wishlist here..."></textarea>

<div id="saved1" class="saved">
✓ Saved
</div>

</div>

<div class="card">

<h2>🍜 Something New Babby Wanna Eat</h2>

<textarea
id="foodwish"
placeholder="Write new food ideas here..."></textarea>

<div id="saved2" class="saved">
✓ Saved
</div>

</div>

<button
class="back"
onclick="window.location.href='index.html'">

🏠 Back

</button>

<script>

const wishlist = document.getElementById("wishlist");
const foodwish = document.getElementById("foodwish");

const saved1 = document.getElementById("saved1");
const saved2 = document.getElementById("saved2");

/* Load Saved Notes */

wishlist.value = localStorage.getItem("babbyWishlist") || "";
foodwish.value = localStorage.getItem("babbyFoodWish") || "";

/* Show Saved Animation */

function showSaved(element){

    element.style.opacity = "1";

    clearTimeout(element.timer);

    element.timer = setTimeout(function(){

        element.style.opacity = "0";

    },1000);

}

/* Auto Save Wishlist */

wishlist.addEventListener("input",function(){

    localStorage.setItem(
        "babbyWishlist",
        wishlist.value
    );

    showSaved(saved1);

});

/* Auto Save Food Ideas */

foodwish.addEventListener("input",function(){

    localStorage.setItem(
        "babbyFoodWish",
        foodwish.value
    );

    showSaved(saved2);

});

</script>

</body>
</html>
